<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faculty | Capitol University</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      color: #222;
    }

    .header {
      background: maroon;
      color: white;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .header p {
      margin: 4px 0 0;
      font-size: 14px;
    }

    /* Tabs */
    .tabs {
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      overflow-x: auto;
      padding: 0 12px;
    }

    .tab {
      border: none;
      background: none;
      padding: 14px 16px;
      font-size: 15px;
      cursor: pointer;
      color: #555;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
    }

    .tab:hover {
      color: maroon;
    }

    .tab.active {
      color: maroon;
      font-weight: bold;
      border-bottom-color: maroon;
    }

    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 12px;
    }

    .panel {
      display: none;
      background: white;
      padding: 20px;
      border-radius: 6px;
    }

    .panel.active {
      display: block;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 18px;
      color: maroon;
    }

    h3 {
      margin: 22px 0 8px;
      font-size: 15px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 6px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 9px;
      margin-top: 4px;
      border: 1px solid #bbb;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }

    input:focus,
    select:focus,
    textarea:focus,
    button:focus-visible {
      outline: 2px solid maroon;
      outline-offset: 1px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 600px) {
      .row {
        grid-template-columns: 1fr;
      }
    }

    .error {
      color: #c00;
      font-size: 13px;
      min-height: 4px;
    }

    #message,
    #settingsMessage {
      color: green;
      font-weight: bold;
      margin-top: 12px;
    }

    #scanMessage {
      font-size: 13px;
      margin-top: 4px;
      font-weight: bold;
    }

    button {
      cursor: pointer;
      font-size: 14px;
    }

    .btn {
      background: maroon;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 10px 20px;
      margin-top: 18px;
    }

    .btn:hover {
      background: #5c0000;
    }

    .btn-light {
      background: white;
      color: maroon;
      border: 1px solid maroon;
      border-radius: 4px;
      padding: 10px 20px;
      margin-top: 18px;
    }

    .btn-danger {
      background: white;
      color: #c00;
      border: 1px solid #c00;
      border-radius: 4px;
      padding: 10px 20px;
    }

    .logout-button {
      background: white;
      color: maroon;
      border: none;
      border-radius: 4px;
      padding: 9px 14px;
      font-weight: bold;
    }

    .small-button {
      padding: 4px 8px;
      margin: 0;
    }

    /* Table */
    .table-box {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 7px;
      text-align: left;
    }

    th {
      background: #f4e6e6;
    }


    .back a {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid maroon;
      border-radius: 6px;
      color: maroon;
      background: white;
      text-decoration: none;
      font-weight: bold;
      margin-top: 16px;
    }

    .back a:hover {
      background: maroon;
      color: white;
    }
  </style>
</head>

<body>

  <div class="header">
    <div>
      <h1>Capitol University</h1>
      <p>Faculty: <span id="facultyName">Faculty</span></p>
    </div>
    <button type="button" class="logout-button" onclick="logout()">Log out</button>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-report" onclick="showTab('report')">Report Offense</button>
    <button class="tab" id="tab-saved" onclick="showTab('saved')">Saved Reports</button>
    <button class="tab" id="tab-settings" onclick="showTab('settings')">Settings</button>
  </div>

  <div class="container">

    <!-- REPORT OFFENSE -->
    <div class="panel active" id="panel-report">
      <form id="offenseForm">
        <h2>Report an Offense</h2>

        <h3>Student Information</h3>
        <label for="studentId">Student ID (scan the barcode on the back of the ID)</label>
        <input type="text" id="studentId" placeholder="Scan or type the Student ID" autocomplete="off" autofocus>
        <div class="error" id="studentIdError"></div>
        <div id="scanMessage"></div>

        <div class="row">
          <div>
            <label for="studentName">Full Name</label>
            <input type="text" id="studentName" placeholder="Student's full name">
            <div class="error" id="studentNameError"></div>
          </div>
          <div>
            <label for="studentEmail">Email</label>
            <input type="email" id="studentEmail" placeholder="Student's email">
            <div class="error" id="studentEmailError"></div>
          </div>
        </div>

        <h3>Offense Details</h3>
        <div class="row">
          <div>
            <label for="offenseType">Offense Type</label>
            <select id="offenseType" onchange="updateCategories()">
              <option value="">Select Offense Type</option>
              <option value="Minor">Minor Offense</option>
              <option value="Major">Major Offense</option>
            </select>
            <div class="error" id="offenseTypeError"></div>
          </div>
          <div>
            <label for="offenseCategory">Offense Category</label>
            <select id="offenseCategory">
              <option value="">Select Offense Type first</option>
            </select>
            <div class="error" id="offenseCategoryError"></div>
          </div>
        </div>

        <label for="specificViolation">Specific Violation</label>
        <input type="text" id="specificViolation" placeholder="e.g. Tardiness, sleeping in class">
        <div class="error" id="specificViolationError"></div>

        <label for="communityServiceHours">Community Service Hours</label>
        <input type="number" id="communityServiceHours" min="0" step="0.5" value="0">

        <label for="remarks">Remarks (optional)</label>
        <textarea id="remarks" rows="3" placeholder="Location, time, witnesses, circumstances..."></textarea>

        <button type="submit" class="btn">Submit</button>
        <button type="reset" class="btn-light" onclick="clearMessages()">Clear</button>
        <div id="message"></div>
      </form>
    </div>

    <!-- SAVED REPORTS -->
    <div class="panel" id="panel-saved">
      <h2>Saved Offense Reports</h2>
      <div class="table-box">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Student ID</th>
              <th>Name</th>
              <th>Type</th>
              <th>Category</th>
              <th>Violation</th>
              <th>CS Hours</th>
              <th>Remarks</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="reportTable"></tbody>
        </table>
      </div>
      <button type="button" class="btn-danger" style="margin-top:14px" onclick="deleteAll()">Delete all reports</button>
    </div>

    <!-- SETTINGS -->
    <div class="panel" id="panel-settings">
      <h2>Settings</h2>

      <h3>Change Password</h3>
      <p style="font-size:14px;margin-top:0">change you password if you want to.</p>

      <label for="currentPassword">Current password</label>
      <input type="password" id="currentPassword" autocomplete="current-password">
      <div class="error" id="currentPasswordError"></div>

      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" autocomplete="new-password">
      <div class="error" id="newPasswordError"></div>

      <label for="confirmNewPassword">Confirm new password</label>
      <input type="password" id="confirmNewPassword" autocomplete="new-password">
      <div class="error" id="confirmNewPasswordError"></div>

      <button class="btn" onclick="changePassword()">Change password</button>
      <div id="settingsMessage"></div>
    </div>

    <p class="back"><a href="Home.html">← Back to Home</a></p>
  </div>

  <script>
    // ---------- TABS ----------
    function showTab(name) {
      var names = ["report", "saved", "settings"];
      for (var i = 0; i < names.length; i++) {
        document.getElementById("panel-" + names[i]).className = "panel";
        document.getElementById("tab-" + names[i]).className = "tab";
      }
      document.getElementById("panel-" + name).className = "panel active";
      document.getElementById("tab-" + name).className = "tab active";
    }

    // ---------- LOGIN / SETTINGS ----------
    function logout() {
      if (!confirm("Are you sure you want to log out?")) { return; }
      localStorage.removeItem("loggedInFacultyEmail");
      localStorage.removeItem("loggedInFacultyName");
      window.location.href = "faculty-login.html";
    }

    function getFacultyName() {
      return localStorage.getItem("loggedInFacultyName") || "Faculty";
    }

    function loadSettings() {
      document.getElementById("facultyName").innerHTML = escapeHtml(getFacultyName());
    }

    function changePassword() {
      var current = document.getElementById("currentPassword").value;
      var newPass = document.getElementById("newPassword").value;
      var confirmPass = document.getElementById("confirmNewPassword").value;
      var message = document.getElementById("settingsMessage");
      message.innerHTML = "";

      document.getElementById("currentPasswordError").innerHTML = "";
      document.getElementById("newPasswordError").innerHTML = "";
      document.getElementById("confirmNewPasswordError").innerHTML = "";

      // The password saved when the faculty registered
      var savedPassword = localStorage.getItem("registeredPassword");

      if (current !== savedPassword) {
        document.getElementById("currentPasswordError").innerHTML = "Current password is incorrect.";
        return;
      }
      if (newPass.length < 6) {
        document.getElementById("newPasswordError").innerHTML = "New password must be at least 6 characters.";
        return;
      }
      if (newPass === current) {
        document.getElementById("newPasswordError").innerHTML = "New password must be different from the current one.";
        return;
      }
      if (confirmPass !== newPass) {
        document.getElementById("confirmNewPasswordError").innerHTML = "Passwords do not match.";
        return;
      }

      localStorage.setItem("registeredPassword", newPass);
      document.getElementById("currentPassword").value = "";
      document.getElementById("newPassword").value = "";
      document.getElementById("confirmNewPassword").value = "";
      message.innerHTML = "Password changed.";
    }

    function escapeHtml(text) {
      var div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    // ---------- STUDENT LIST (edit this) ----------
    var students = [
      { id: "2024001", name: "Juan Dela Cruz", email: "juan@example.com" },
      { id: "2024002", name: "Maria Santos", email: "maria@example.com" },
      { id: "2024003", name: "Pedro Reyes", email: "pedro@example.com" }
    ];

    var minorList = ["First warning", "Second warning", "Third warning"];
    var majorList = ["Suspension", "Exclusion", "Expulsion"];

    // ---------- BARCODE SCANNING (scanner types the ID, then presses Enter) ----------
    document.getElementById("studentId").onkeydown = function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        findStudent();
      }
    };

    function findStudent() {
      var scanned = document.getElementById("studentId").value.trim();
      var scanMessage = document.getElementById("scanMessage");
      if (scanned === "") { return; }

      var found = null;
      for (var i = 0; i < students.length; i++) {
        if (students[i].id === scanned) { found = students[i]; }
      }

      if (found !== null) {
        document.getElementById("studentName").value = found.name;
        document.getElementById("studentEmail").value = found.email;
        scanMessage.style.color = "green";
        scanMessage.innerHTML = "Student found: " + escapeHtml(found.name);
        document.getElementById("offenseType").focus();
      } else {
        document.getElementById("studentName").value = "";
        document.getElementById("studentEmail").value = "";
        scanMessage.style.color = "red";
        scanMessage.innerHTML = "ID not found. Please type the name and email.";
        document.getElementById("studentName").focus();
      }
    }

    // ---------- REPORTS (localStorage) ----------
    function getReports() {
      var saved = localStorage.getItem("offenseReports");
      if (saved === null) { return []; }
      return JSON.parse(saved);
    }

    function saveReports(list) {
      localStorage.setItem("offenseReports", JSON.stringify(list));
    }

    function showReports() {
      var list = getReports();
      var rows = "";
      if (list.length === 0) {
        rows = "<tr><td colspan='9'>No reports yet.</td></tr>";
      }
      for (var i = 0; i < list.length; i++) {
        var r = list[i];
        rows += "<tr>" +
          "<td>" + escapeHtml(r.date) + "</td>" +
          "<td>" + escapeHtml(r.studentId) + "</td>" +
          "<td>" + escapeHtml(r.studentName) + "</td>" +
          "<td>" + escapeHtml(r.offenseType) + "</td>" +
          "<td>" + escapeHtml(r.offenseCategory) + "</td>" +
          "<td>" + escapeHtml(r.specificViolation) + "</td>" +
          "<td>" + (r.hours || 0) + "</td>" +
          "<td>" + escapeHtml(r.remarks) + "</td>" +
          "<td><button class='btn-danger small-button' onclick='deleteReport(" + i + ")'>Delete</button></td>" +
          "</tr>";
      }
      document.getElementById("reportTable").innerHTML = rows;
    }

    function deleteReport(index) {
      if (confirm("Delete this report?")) {
        var list = getReports();
        list.splice(index, 1);
        saveReports(list);
        showReports();
      }
    }

    function deleteAll() {
      if (confirm("Delete ALL reports? This cannot be undone.")) {
        saveReports([]);
        showReports();
      }
    }

    // ---------- FORM ----------
    function updateCategories() {
      var type = document.getElementById("offenseType").value;
      var category = document.getElementById("offenseCategory");
      var list = [];
      if (type === "Minor") { list = minorList; }
      else if (type === "Major") { list = majorList; }

      category.innerHTML = "<option value=''>Select Offense Category</option>";
      for (var i = 0; i < list.length; i++) {
        category.innerHTML += "<option value='" + list[i] + "'>" + list[i] + "</option>";
      }
    }

    function checkField(fieldId, errorMessage) {
      var value = document.getElementById(fieldId).value.trim();
      var errorBox = document.getElementById(fieldId + "Error");
      if (value === "") { errorBox.innerHTML = errorMessage; return false; }
      errorBox.innerHTML = "";
      return true;
    }

    document.getElementById("offenseForm").onsubmit = function (event) {
      event.preventDefault();

      var ok1 = checkField("studentId", "Please enter the Student ID.");
      var ok2 = checkField("studentName", "Please enter the Full Name.");
      var ok3 = checkField("studentEmail", "Please enter the Email.");
      var ok4 = checkField("offenseType", "Please select an Offense Type.");
      var ok5 = checkField("offenseCategory", "Please select an Offense Category.");
      var ok6 = checkField("specificViolation", "Please enter the Specific Violation.");
      if (!ok1 || !ok2 || !ok3 || !ok4 || !ok5 || !ok6) { return; }

      var report = {
        date: new Date().toLocaleString(),
        studentId: document.getElementById("studentId").value.trim(),
        studentName: document.getElementById("studentName").value.trim(),
        studentEmail: document.getElementById("studentEmail").value.trim(),
        offenseType: document.getElementById("offenseType").value,
        offenseCategory: document.getElementById("offenseCategory").value,
        specificViolation: document.getElementById("specificViolation").value.trim(),
        hours: Number(document.getElementById("communityServiceHours").value) || 0,
        remarks: document.getElementById("remarks").value.trim()
      };

      var list = getReports();
      list.push(report);
      saveReports(list);

      showReports();
      document.getElementById("offenseForm").reset();
      updateCategories();
      document.getElementById("scanMessage").innerHTML = "";
      document.getElementById("message").innerHTML = "Offense report saved!";
      document.getElementById("studentId").focus();
    };

    function clearMessages() {
      var errors = document.getElementsByClassName("error");
      for (var i = 0; i < errors.length; i++) { errors[i].innerHTML = ""; }
      document.getElementById("message").innerHTML = "";
      document.getElementById("scanMessage").innerHTML = "";
      setTimeout(updateCategories, 0);
      document.getElementById("studentId").focus();
    }

    loadSettings();
    showReports();
  </script>
</body>
</html>
