<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faculty | Capitol University</title>

<style>
  /* ---------- BASIC STYLES ---------- */
  body { font-family: Arial, sans-serif; background: #f2f2f2; margin: 0; }

  .header { background: maroon; color: white; padding: 15px 20px; }
  .header h1 { margin: 0; font-size: 24px; }
  .header p  { margin: 5px 0 0; }

  .container {
    max-width: 800px;
    margin: 20px auto;
    background: white;
    padding: 20px;
    border-radius: 6px;
  }

  h2 { margin-top: 25px; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
  label { display: block; margin-top: 12px; font-weight: bold; }

  input, select, textarea {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
    box-sizing: border-box;
  }

  .error { color: red; font-size: 13px; }
  button { margin-top: 20px; padding: 10px 20px; cursor: pointer; }
  #message { color: green; font-weight: bold; margin-top: 15px; }
  #scanMessage { font-size: 13px; margin-top: 4px; font-weight: bold; }

  /* Table of saved reports */
  .table-box { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
  th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
  th { background: #e8eaf0; }
  .small-button { margin: 0; padding: 4px 8px; }

 .back { margin: 0 0 0pxs; }

.back a {
  display: inline-block;
  padding: 8px 14px;
  border: 1px solid #1c2540;
  border-radius: 6px;
  color: #1c2540;
  background: white;
  text-decoration: none;
  font-weight: bold;
}
.back a:hover { background: #1c2540; color: white; }
</style>
</head>

<body>

<!-- ---------- HEADER ---------- -->
<div class="header">
  <h1>Capitol University</h1>
  <p>Faculty - Offense Management System</p>
</div>

<div class="container">

  <!-- ---------- FORM ---------- -->
  <form id="offenseForm">

    <h2>Student Information</h2>

    <label for="studentId">Student ID (scan the barcode back of your ID)</label>
    <input type="text" id="studentId" placeholder="Enter the studentId" autocomplete="off" autofocus>
    <div class="error" id="studentIdError"></div>
    <div id="scanMessage"></div>

    <label for="studentName">Full Name</label>
    <input type="text" id="studentName" placeholder="Enter your Full name">
    <div class="error" id="studentNameError"></div>

    <label for="studentEmail">Email</label>
    <input type="email" id="studentEmail" placeholder="Enter your email">
    <div class="error" id="studentEmailError"></div>

    <h2>Offense Details</h2>

    <label for="offenseType">Offense Type</label>
    <select id="offenseType" onchange="updateCategories()">
      <option value="">Select Offense Type</option>
      <option value="Minor">Minor Offense</option>
      <option value="Major">Major Offense</option>
    </select>
    <div class="error" id="offenseTypeError"></div>

    <label for="offenseCategory">Offense Category</label>
    <select id="offenseCategory">
      <option value="">Select Offense Type first</option>
    </select>
    <div class="error" id="offenseCategoryError"></div>

    <label for="specificViolation">Specific Violation</label>
    <input type="text" id="specificViolation" placeholder="e.g. Tardiness, sleeping in class">
    <div class="error" id="specificViolationError"></div>

    <label for="remarks">Remarks (optional)</label>
    <textarea id="remarks" rows="3" placeholder="Provide details about the Violation: location time,witness,circumtances..."></textarea>

    <button type="submit">Submit</button>
    <button type="reset" onclick="clearMessages()">Clear</button>

    <div id="message"></div>
  </form>

  <!-- ---------- SAVED REPORTS ---------- -->
  <h2>Saved Offense Reports</h2>
  <div class="table-box">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Student ID</th>
          <th>Name</th>
          <th>Type</th>
          <th>Category</th>
          <th>Violation</th>
          <th>Remarks</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="reportTable"></tbody>
    </table>
  </div>
  <button type="button" onclick="deleteAll()">Delete all reports</button>

  <p class="back">
            <a href="Home.html">← Back to Home</a>
        </p>


</div>


<!-- ---------- JAVASCRIPT ---------- -->
<script>

  // Category lists (edit these to match your student handbook)
  var minorList = ["First warning", "Second warning", "Third warning"];
  var majorList = ["Suspension", "Exclusion", "Expulsion"];


  // ----- STUDENT LIST (edit this: add your students here) -----
  // When an ID is scanned, the name and email are filled in from this list.
  var students = [
    { id: "2024001", name: "Juan Dela Cruz", email: "juan@example.com" },
    { id: "2024002", name: "Maria Santos",   email: "maria@example.com" },
    { id: "2024003", name: "Pedro Reyes",    email: "pedro@example.com" }
  ];


  // ----- BARCODE SCANNING -----
  // A barcode scanner works like a keyboard: it types the ID number
  // and then presses Enter. So we listen for the Enter key.

  document.getElementById("studentId").onkeydown = function (event) {
    if (event.key === "Enter") {
      event.preventDefault();     // stop Enter from submitting the form
      findStudent();
    }
  };

  function findStudent() {
    var scanned = document.getElementById("studentId").value.trim();
    var scanMessage = document.getElementById("scanMessage");

    if (scanned === "") {
      return;
    }

    // Look for the scanned ID in the student list
    var found = null;
    for (var i = 0; i < students.length; i++) {
      if (students[i].id === scanned) {
        found = students[i];
      }
    }

    if (found !== null) {
      // Student found: fill in the name and email
      document.getElementById("studentName").value = found.name;
      document.getElementById("studentEmail").value = found.email;
      scanMessage.style.color = "green";
      scanMessage.innerHTML = "Student found: " + found.name;
      document.getElementById("offenseType").focus();   // go to the next step
    } else {
      // Student not found: type the name and email by hand
      document.getElementById("studentName").value = "";
      document.getElementById("studentEmail").value = "";
      scanMessage.style.color = "red";
      scanMessage.innerHTML = "ID not found. Please type the name and email.";
      document.getElementById("studentName").focus();
    }
  }


  // ----- LOAD AND SAVE (uses the browser's localStorage, no database) -----

  // Get all saved reports. Returns an empty list if nothing is saved yet.
  function getReports() {
    var saved = localStorage.getItem("offenseReports");
    if (saved === null) {
      return [];
    }
    return JSON.parse(saved);
  }

  // Save the whole list of reports.
  function saveReports(list) {
    localStorage.setItem("offenseReports", JSON.stringify(list));
  }


  // ----- SHOW THE TABLE -----

  function showReports() {
    var list = getReports();
    var rows = "";

    if (list.length === 0) {
      rows = "<tr><td colspan='8'>No reports yet.</td></tr>";
    }

    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      rows += "<tr>" +
        "<td>" + r.date + "</td>" +
        "<td>" + r.studentId + "</td>" +
        "<td>" + r.studentName + "</td>" +
        "<td>" + r.offenseType + "</td>" +
        "<td>" + r.offenseCategory + "</td>" +
        "<td>" + r.specificViolation + "</td>" +
        "<td>" + r.remarks + "</td>" +
        "<td><button class='small-button' onclick='deleteReport(" + i + ")'>Delete</button></td>" +
        "</tr>";
    }

    document.getElementById("reportTable").innerHTML = rows;
  }


  // ----- DELETE -----

  function deleteReport(index) {
    if (confirm("Delete this report?")) {
      var list = getReports();
      list.splice(index, 1);      // remove 1 item at this position
      saveReports(list);
      showReports();
    }
  }

  function deleteAll() {
    if (confirm("Delete ALL reports? This cannot be undone.")) {
      saveReports([]);
      showReports();
    }
  }


  // ----- CATEGORY DROPDOWN -----

  function updateCategories() {
    var type = document.getElementById("offenseType").value;
    var category = document.getElementById("offenseCategory");
    var list = [];

    if (type === "Minor") {
      list = minorList;
    } else if (type === "Major") {
      list = majorList;
    }

    category.innerHTML = "<option value=''>Select Offense Category</option>";

    for (var i = 0; i < list.length; i++) {
      category.innerHTML += "<option value='" + list[i] + "'>" + list[i] + "</option>";
    }
  }


  // ----- CHECK ONE FIELD -----

  function checkField(fieldId, errorMessage) {
    var value = document.getElementById(fieldId).value.trim();
    var errorBox = document.getElementById(fieldId + "Error");

    if (value === "") {
      errorBox.innerHTML = errorMessage;
      return false;
    } else {
      errorBox.innerHTML = "";
      return true;
    }
  }


  // ----- SUBMIT -----

  document.getElementById("offenseForm").onsubmit = function (event) {
    event.preventDefault();

    var ok1 = checkField("studentId", "Please enter the Student ID.");
    var ok2 = checkField("studentName", "Please enter the Full Name.");
    var ok3 = checkField("studentEmail", "Please enter the Email.");
    var ok4 = checkField("offenseType", "Please select an Offense Type.");
    var ok5 = checkField("offenseCategory", "Please select an Offense Category.");
    var ok6 = checkField("specificViolation", "Please enter the Specific Violation.");

    if (!ok1 || !ok2 || !ok3 || !ok4 || !ok5 || !ok6) {
      return;
    }

    // Make one report
    var report = {
      date: new Date().toLocaleString(),
      studentId: document.getElementById("studentId").value.trim(),
      studentName: document.getElementById("studentName").value.trim(),
      studentEmail: document.getElementById("studentEmail").value.trim(),
      offenseType: document.getElementById("offenseType").value,
      offenseCategory: document.getElementById("offenseCategory").value,
      specificViolation: document.getElementById("specificViolation").value.trim(),
      remarks: document.getElementById("remarks").value.trim()
    };

    // Add it to the saved list
    var list = getReports();
    list.push(report);
    saveReports(list);

    // Update the screen
    showReports();
    document.getElementById("message").innerHTML = "Offense report saved!";
    document.getElementById("offenseForm").reset();
    updateCategories();
    document.getElementById("scanMessage").innerHTML = "";
    document.getElementById("studentId").focus();    // ready for the next scan
  };


  // ----- CLEAR BUTTON -----

  function clearMessages() {
    var errors = document.getElementsByClassName("error");
    for (var i = 0; i < errors.length; i++) {
      errors[i].innerHTML = "";
    }
    document.getElementById("message").innerHTML = "";
    document.getElementById("scanMessage").innerHTML = "";
    setTimeout(updateCategories, 0);
    document.getElementById("studentId").focus();
  }


  // Show the saved reports when the page opens
  showReports();

</script>

</body>
</html>
