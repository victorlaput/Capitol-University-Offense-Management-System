<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Capitol University Offense Management System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;

            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.50),
                    rgba(255, 255, 255, 0.50)
                ),
                url("CU.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            flex-direction: column;
        }


        /* MAIN CONTAINER */

        .container {
            width: 90%;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            padding: 40px 0 30px;
        }


        /* LOGO */

        .logo {
            width: 180px;
            max-width: 60%;
            height: auto;
            margin-bottom: 20px;
        }


        /* TITLE */

        h1 {
            font-size: 42px;
            font-weight: bold;
            line-height: 1.2;
        }

        h2 {
            font-size: 22px;
            color: #7a0000;
            margin-top: 10px;
            letter-spacing: 1px;
            line-height: 1.4;
        }


        /* DESCRIPTION */

        .description {
            margin-top: 35px;
            line-height: 1.7;
            font-size: 18px;
            color: #222;
        }


        /* LOGIN TITLE */

        h3 {
            margin-top: 65px;
            color: #8B0000;
            font-size: 32px;
        }


        /* BUTTONS */

        .buttons {
            margin-top: 25px;
            width: 100%;
        }

        button {
            width: 100%;
            padding: 16px;
            margin: 10px 0;

            border: none;
            border-radius: 8px;

            background: #8B0000;
            color: white;

            font-size: 21px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background: #660000;
            transform: translateY(-2px);
        }


        /* REGISTER */

        .register {
            margin-top: 25px;
            font-size: 18px;
        }

        .register a {
            color: #8B0000;
            text-decoration: none;
            font-weight: bold;
        }

        .register a:hover {
            text-decoration: underline;
        }


        /* FOOTER */

        footer {
            width: 100%;
            margin-top: auto;

            text-align: center;

            padding: 20px 10px;

            border-top: 1px solid #ddd;

            color: #555;
            font-size: 14px;

            background: rgba(255, 255, 255, 0.5);
        }


        /* TABLET */

        @media (max-width: 768px) {

            .container {
                width: 88%;
                padding-top: 35px;
            }

            .logo {
                width: 160px;
            }

            h1 {
                font-size: 34px;
            }

            h2 {
                font-size: 20px;
            }

            .description {
                font-size: 17px;
                line-height: 1.6;
                margin-top: 30px;
            }

            h3 {
                font-size: 29px;
                margin-top: 50px;
            }

            button {
                font-size: 19px;
                padding: 15px;
            }

            .register {
                font-size: 17px;
            }
        }


        /* MOBILE PHONE */

        @media (max-width: 480px) {

            body {
                background-attachment: scroll;
            }

            .container {
                width: 92%;
                padding-top: 25px;
            }

            .logo {
                width: 130px;
                max-width: 50%;
                margin-bottom: 15px;
            }

            h1 {
                font-size: 28px;
            }

            h2 {
                font-size: 17px;
                margin-top: 7px;
            }

            .description {
                font-size: 15px;
                line-height: 1.6;
                margin-top: 25px;
            }

            h3 {
                font-size: 25px;
                margin-top: 40px;
            }

            .buttons {
                margin-top: 18px;
            }

            button {
                font-size: 17px;
                padding: 14px;
                margin: 8px 0;
            }

            .register {
                font-size: 15px;
                margin-top: 20px;
            }

            footer {
                font-size: 13px;
                padding: 15px 10px;
            }
        }


        /* VERY SMALL PHONES */

        @media (max-width: 360px) {

            .container {
                width: 94%;
            }

            .logo {
                width: 110px;
            }

            h1 {
                font-size: 25px;
            }

            h2 {
                font-size: 15px;
            }

            .description {
                font-size: 14px;
            }

            h3 {
                font-size: 22px;
            }

            button {
                font-size: 16px;
                padding: 13px;
            }
        }

    </style>

</head>


<body>

    <div class="container">

        <img src="Logo.png" class="logo" alt="Capitol University Logo">

        <h1>Capitol University</h1>

        <h2>Offense Management System</h2>


        <p class="description">
            A digital offense management system that helps administrators,
            faculty, and students efficiently record, monitor, and manage
            student offenses at Capitol University.
        </p>


        <h3>LOGIN AS</h3>


        <div class="buttons">

            <button onclick="location.href='admin-login.html'">
                ADMIN
            </button>

            <button onclick="location.href='faculty-login.html'">
                FACULTY
            </button>

            <button onclick="location.href='student-login.html'">
                STUDENT
            </button>

        </div>


        <p class="register">

            Need an account?

            <a href="Register-Account.html">
                Register here
            </a>

        </p>

    </div>


    <footer>
        Capitol University @2026
    </footer>


</body>

</html>
