<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Dashboard</title>
</head>
<body>
<div class="box">

  <!-- Welcome message (name comes from the register page) -->
  <h1>Welcome, <span id="studentName"></span>!</h1>

  <div class="stats">
    <div class="stat"><div class="number" id="totalOffenses">0</div>Confirmed Offenses</div>
    <div class="stat"><div class="number" id="totalHours">0</div>Community Service Hours</div>
  </div>

  <h2>My Offenses</h2>
  <table id="offenseTable">
    <tr>
      <th>Date</th>
      <th>Type</th>
      <th>Category</th>
      <th>Violation</th>
      <th>Status</th>
      <th>CS Hours</th>
      <th>Remarks</th>
    </tr>
  </table>

  <p id="emptyMessage"></p>
  <br>

  <button onclick="logout()">Log out</button>
</div>

<script>
  // Must be the SAME key the faculty and dean pages use.
  var KEY = "offenseReports";

  // 1. Get the logged-in student's name (saved by the register page)
  var name = localStorage.getItem("registeredName") || "";
  var email = localStorage.getItem("registeredEmail") || "";
  document.getElementById("studentName").textContent = name;

  // 2. Show this student's offenses
  function showOffenses() {
    var all = JSON.parse(localStorage.getItem(KEY) || "[]");

    var table = document.getElementById("offenseTable");
    while (table.rows.length > 1) {
      table.deleteRow(1);
    }

    var count = 0;
    var hours = 0;
    var found = 0;

    for (var i = 0; i < all.length; i++) {
      var r = all[i];

      // match the report to the logged-in student (by email or name)
      var sameEmail = email !== "" && String(r.studentEmail).toLowerCase() === email.toLowerCase();
      var sameName = name !== "" && String(r.studentName).toLowerCase() === name.toLowerCase();

      if (sameEmail || sameName) {
        found = found + 1;
        var row = table.insertRow();
        row.insertCell().textContent = r.date;
        row.insertCell().textContent = r.offenseType;
        row.insertCell().textContent = r.offenseCategory;
        row.insertCell().textContent = r.specificViolation;

        if (r.status === "Confirmed") {
          // Dean already confirmed: show the CS hours
          row.insertCell().textContent = "Confirmed";
          row.insertCell().textContent = r.hours || 0;
          count = count + 1;
          hours = hours + Number(r.hours || 0);
        } else {
          // Not yet confirmed by the Dean: hide the hours
          row.insertCell().textContent = "Waiting for Dean";
          row.insertCell().textContent = "-";
        }

        row.insertCell().textContent = r.remarks || "";
      }
    }

    document.getElementById("totalOffenses").textContent = count;
    document.getElementById("totalHours").textContent = hours;

    if (found === 0) {
      document.getElementById("emptyMessage").textContent = "No offenses found.";
    } else {
      document.getElementById("emptyMessage").textContent = "";
    }
  }

  function logout() {
    window.location.href = "index.html";
  }

  // Only for testing. Delete when the faculty and dean pages save real data.
  function addSampleData() {
    var sample = [
      { date: "10/5/2026", studentId: "2095294", studentName: "John Victor Laput", studentEmail: "john@example.com", offenseType: "Minor", offenseCategory: "First warning", specificViolation: "Always late", status: "Confirmed", hours: 4, remarks: "" },
      { date: "10/6/2026", studentId: "2095294", studentName: "John Victor Laput", studentEmail: "john@example.com", offenseType: "Major", offenseCategory: "Second warning", specificViolation: "Cursing in class", status: "Pending", hours: 0, remarks: "Witness by a Instructor" }
    ];
    localStorage.setItem(KEY, JSON.stringify(sample));
    localStorage.setItem("registeredName", "John Victor Laput");
    localStorage.setItem("registeredEmail", "john@example.com");
    location.reload();
  }

  showOffenses();
</script>
</body>
</html>
