<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.50), rgba(255, 255, 255, 0.50)),
                url("CU.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: auto;
            text-align: center;
            padding-top: 50px;
        }

        .login-box {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h3 {
            margin-bottom: 30px;
            color: #8B0000;
            font-size: 35px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #8B0000;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #7a0000;
        }

        .back {
            margin-top: 20px;
        }

        .back a {
            color: #8B0000;
            text-decoration: none;
        }

        footer {
            margin-top: 50px;
            text-align: center;
            color: #8B0000;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="login-box">

            <h3>Student LOGIN</h3>

            <form id="studentLogin">

                <input type="text" id="email" placeholder="Email" required>

                <input type="password" id="password" placeholder="Password" required>

                <button type="submit">LOGIN</button>

            </form>

            <p class="back">
                <a href="index.html">← Back to Home</a>
            </p>

        </div>

    </div>

    <footer>
        Capitol University © 2026
    </footer>

    <script>

        const studentLogin = document.getElementById("studentLogin");

        studentLogin.addEventListener("submit", function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim().toLowerCase();
            const passwordValue = document.getElementById("password").value;

            const savedEmail = localStorage.getItem("registeredEmail");
            const savedPassword = localStorage.getItem("registeredPassword");
            const savedRole = localStorage.getItem("registeredRole");

            if (savedEmail === null) {
                alert("No account found,Please register first.");
                return;
            }

            if (email !== savedEmail || passwordValue !== savedPassword) {
                alert("Invalid email or password");
                return;
            }

            if (savedRole !== "Student") {
                alert("This account is not a student account.");
                return;
            }
            else {
                localStorage.setItem("loggedInStudentEmail", email);
                localStorage.setItem("loggedInStudentName", localStorage.getItem("registeredName") || email);
                alert("Login successful!");
                window.location.href = "studentdashboard.html";
            }
        });
    </script>
</body>
</head>
</html>
