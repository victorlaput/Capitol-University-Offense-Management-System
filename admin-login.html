<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
</head>
<body>
    <style>
        <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
     margin: 0;
    min-height: 100vh;
    background-image: 
    linear-gradient(rgba(255, 255, 255, 0.50), rgba(255, 255, 255, 0.50)),url("CU.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

    .container {
        width: 90%;
        max-width: 500px;
        margin: auto;
        text-align: center;
        padding-top: 50px;
    }

    .login-box {
        background: #fff;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h3 {
        margin-bottom: 30px;
        color: #8B0000;
        font-size: 35px;
    }

    input[type="text"],
    input[type="password"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    #username {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #8B0000;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background: #7a0000;
    }

    .back {
        margin-top: 20px;
    }

    .back a {
        color: #8B0000;
        text-decoration: none;
    }

    footer {
    text-align: center;
    color: maroon;
    margin-top: 270px;
}
    </style>
<center>
<div class="container"> 
  
    <div class="login-box"> 
 
        <h3>ADMIN LOGIN</h3> 
 
        <form onsubmit="login(event)"> 
 
            <input type="text" 
                   id="username"
                   name="username" 
                   placeholder="Username" 
                   required> 
 
            <input type="password" 
                   id="password"
                   name="password" 
                   placeholder="Password" 
                   required> 
 
            <button type="submit">LOGIN</button> 
 
        </form> 
 
        <p class="back"> 
            <a href="index.html">← Back to Home</a> 
        </p> 
 
    </div> 
    
</div> 
 
<footer> 
    Capitol University @2026 
</footer>


<script>

function login(event) {

    // Prevent the form from trying to open a PHP file
    event.preventDefault();

    // Get the values entered by the user
    var username = document.getElementById("username").value;
    var password = document.getElementById("password").value;

    // Admin account
    var adminUsername = "2095294@g.cu.edu.ph";
    var adminPassword = "123456";

    // Check username and password
    if (username === adminUsername && password === adminPassword) {

        // Go directly to the admin page
        window.location.href = "Admindashboard.html";

    } else {

        alert("Invalid username or password!");

    }
}

</script>

</body>
</html>
